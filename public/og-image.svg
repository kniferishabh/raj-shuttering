<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#E8890C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8890C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo mark -->
  <rect x="80" y="80" width="90" height="90" rx="14" fill="#E8890C"/>
  <text x="125" y="143" text-anchor="middle" font-family="Impact, sans-serif" font-size="44" fill="#0A0A0A" font-weight="700">RS</text>

  <!-- Brand name -->
  <text x="190" y="120" font-family="Impact, sans-serif" font-size="32" fill="#F0EBE1" letter-spacing="2">RAJ SHUTTERING</text>
  <text x="190" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#E8890C" letter-spacing="4">EST. 2008 &#183; VARANASI</text>

  <!-- Headline -->
  <text x="80" y="330" font-family="Impact, sans-serif" font-size="100" font-weight="700" fill="#F0EBE1" letter-spacing="2">STRENGTH ABOVE.</text>
  <text x="80" y="430" font-family="Impact, sans-serif" font-size="100" font-weight="700" fill="#E8890C" letter-spacing="2">SAFETY BELOW.</text>

  <!-- Subtext -->
  <text x="80" y="500" font-family="Arial, sans-serif" font-size="22" fill="#A09880">Premium shuttering &#38; scaffolding solutions for construction projects across Varanasi.</text>

  <!-- Trust bar -->
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#E8890C" letter-spacing="3">&#9733; 4.5 RATING  &#183;  16+ YEARS  &#183;  500+ PROJECTS</text>
</svg>
